name: altintel-scan

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Persist state
        run: |
          git config user.name "altintel-bot"
          git config user.email "bot@altintel.local"
          git add state.json exchange_snapshot.json
          git commit -m "chore: update state $(date -u +%FT%TZ)" || echo "无变更"
          git push || echo "推送失败"
